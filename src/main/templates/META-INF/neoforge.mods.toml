# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional integrations. Each is gated behind ModList.isLoaded in the
# consumer, so absence no-ops. Floors copied from quick-loot, the reference
# integrations for the same mods.
[[dependencies.${mod_id}]]
modId = "ftbteams"
type = "optional"
versionRange = "[2101.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "openpartiesandclaims"
type = "optional"
versionRange = "[0.30,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tensura"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
